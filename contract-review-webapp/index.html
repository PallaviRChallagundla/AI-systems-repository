<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="brand-mark">CR</div>
    <h1>Contract Review</h1>
  </div>
  <div class="header-meta">
    <div id="headerFileTag" class="file-tag" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      <span id="headerFileName"></span>
    </div>
    <div id="headerStatus" class="status-badge" hidden>Under Review</div>
  </div>
</header>

<main class="layout">
  <section class="panel contract-panel">
    <div class="panel-toolbar">
      <div class="toolbar-meta">
        <span id="contractFileName" class="toolbar-title">Contract</span>
        <span id="contractFileMeta" class="toolbar-sub"></span>
      </div>
      <div id="toolbarActions" class="toolbar-actions" hidden>
        <button id="openTabBtn" type="button" class="icon-btn" title="Open in new tab" aria-label="Open in new tab">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
        </button>
        <button id="downloadBtn" type="button" class="icon-btn" title="Download" aria-label="Download">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
        <button id="removeBtn" type="button" class="icon-btn icon-btn-danger" title="Remove" aria-label="Remove">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>

    <div id="dropZone" class="upload-area">
      <input type="file" id="fileInput" accept="application/pdf" hidden>
      <div class="upload-prompt">
        <div class="upload-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9.5 14.5L12 12l2.5 2.5"/></svg>
        </div>
        <p class="upload-title">Drag &amp; drop a PDF here</p>
        <p class="upload-sub">or</p>
        <button id="browseBtn" type="button" class="browse-btn">Browse files</button>
      </div>
    </div>

    <div id="viewerWrap" class="viewer-wrap" hidden>
      <iframe id="pdfViewer" title="Contract PDF preview"></iframe>
    </div>
  </section>

  <section class="panel chat-panel">
    <div class="panel-header">
      <h2>Ask about this contract</h2>
      <p class="panel-subtitle">Type a question below to get started</p>
    </div>

    <div id="chatMessages" class="chat-messages">
      <div class="message assistant">
        <div class="avatar">AI</div>
        <div class="bubble">Upload a contract and ask me anything about it.</div>
      </div>
    </div>

    <form id="chatForm" class="chat-input-row">
      <textarea id="chatInput" placeholder="Ask about a clause, deadline, or obligation…" rows="1" autocomplete="off"></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
